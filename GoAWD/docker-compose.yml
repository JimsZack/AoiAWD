version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: goawd-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - goawd-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  goawd-server:
    build: .
    container_name: goawd-server
    ports:
      - "1337:1337"   # HTTP
      - "8023:8023"   # TCP
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - TOKEN=${GOAWD_TOKEN:-changeme}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - goawd-network
    restart: unless-stopped

networks:
  goawd-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
